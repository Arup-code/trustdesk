server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies API calls to the backend container so the frontend and API share
    # one origin (https://trustdesk.dexcode.app) in production -- no CORS
    # needed, and the browser never sees the backend's internal address.
    # The trailing slash on proxy_pass strips the /api prefix before
    # forwarding, e.g. /api/tickets -> http://backend:8080/tickets.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
